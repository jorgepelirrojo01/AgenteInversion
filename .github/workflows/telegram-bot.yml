name: Bot de Telegram

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escrituras-al-repo
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python telegram_bot.py

      - name: Guardar cambios (config del bot)
        run: |
          git config user.name "agente-inversion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bot_config.json
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Bot: actualizar config"
          exito=0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exito=1 && break
            echo "Push rechazado (intento $i), reintentando..."
            sleep 5
          done
          if [ "$exito" != "1" ]; then
            echo "ERROR: no se pudo hacer push tras 3 intentos."
            exit 1
          fi

      # Este paso se ejecuta SIEMPRE, incluso si algun paso anterior fallo
      # (checkout, instalar dependencias, el propio script...). Es la ultima
      # linea de defensa: garantiza que SIEMPRE llega un aviso a Telegram si
      # algo se rompio antes de que Python pudiera avisar por su cuenta.
      - name: Aviso de emergencia si algun paso anterior fallo
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ El workflow 'Bot de Telegram' ha fallado en uno de sus pasos (checkout, instalar dependencias, o el propio script) ANTES de que el bot pudiera avisar por su cuenta. Revisa el log completo en la pestaña Actions de GitHub para ver el detalle exacto." \
            > /dev/null || true
